name: EUVARO Alibaba API Probe

on:
  push:
    branches: [euvaro-live-price-audit-20260825]
    paths:
      - 'euvaro-price-audit/**'
      - '.github/workflows/euvaro-price-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Alibaba anonymous Europe API
        run: bash euvaro-price-audit/api_probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: euvaro-api-probe-results
          path: |
            euvaro-price-audit/api-summary.json
            euvaro-price-audit/api-page-1.json
            euvaro-price-audit/api-page-2.json
            euvaro-price-audit/csrf.json
          if-no-files-found: warn
